<!doctype html>
<html lang="zh-CN">
  <head>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#181818" />
    <link rel="icon" type="image/webp" href="/images/app-icon.webp" />
    <link rel="stylesheet" href="/legal.css" />
    <title>页面未找到 · 珠记</title>
    <style>
      .wrap {
        width: min(800px, calc(100% - 32px));
        margin: auto;
      }
      .button {
        display: inline-flex;
        text-decoration: none;
        align-items: center;
        min-height: 48px;
      }
      a {
        color: var(--green);
      }
    </style>
    <link rel="stylesheet" href="/fonts/app-fonts.css" />
    <link
      rel="preload"
      href="/fonts/noto-serif-sc-web.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <button
      class="theme-toggle legal-theme-floating"
      type="button"
      data-theme-toggle
      aria-label="切换明暗主题"
      title="切换明暗主题"
    >
      <span class="theme-glyph"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8" />
          <path
            d="M12 4a8 8 0 0 0 0 16Z"
            fill="currentColor"
            stroke="none"
          /></svg
      ></span>
    </button>
    <main class="wrap legal-main not-found">
      <img
        src="/images/app-icon.webp"
        alt="珠记应用图标"
        width="64"
        height="64"
      />
      <p>404 / 珠记</p>
      <h1>这一页，<br />还没有记下。</h1>
      <p>你访问的页面不存在。回到首页，继续认识这一方算盘。</p>
      <a class="button" href="/">返回珠记首页 →</a>
    </main>
  </body>
</html>
